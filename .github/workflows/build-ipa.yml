name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Show available simulators
      run: xcrun simctl list devices available | head -20
    
    - name: Build for simulator
      run: |
        cd NeteaseMusic
        xcodebuild build \
          -project NeteaseMusic.xcodeproj \
          -scheme NeteaseMusic \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Archive for iOS
      run: |
        cd NeteaseMusic
        xcodebuild archive \
          -project NeteaseMusic.xcodeproj \
          -scheme NeteaseMusic \
          -destination 'generic/platform=iOS' \
          -archivePath build/NeteaseMusic.xcarchive \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          SKIP_INSTALL=NO
        
    - name: Export IPA
      run: |
        cd NeteaseMusic
        xcodebuild -exportArchive \
          -archivePath build/NeteaseMusic.xcarchive \
          -exportPath build/IPA \
          -exportOptionsPlist ExportOptions-GHA.plist \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: NeteaseMusic-IPA
        path: NeteaseMusic/build/IPA/NeteaseMusic.ipa
        retention-days: 30
        
    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: NeteaseMusic-xcarchive
        path: NeteaseMusic/build/NeteaseMusic.xcarchive
        retention-days: 30
