name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install dependencies
      run: |
        if [ -f "NeteaseMusic/Podfile" ]; then
          pod install --project-directory=NeteaseMusic
        fi
        
    - name: Build for simulator (no code signing)
      run: |
        xcodebuild build \
          -project NeteaseMusic/NeteaseMusic.xcodeproj \
          -scheme NeteaseMusic \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          IPHONEOS_DEPLOYMENT_TARGET=15.0
    
    - name: Archive for iOS
      run: |
        xcodebuild archive \
          -project NeteaseMusic/NeteaseMusic.xcodeproj \
          -scheme NeteaseMusic \
          -destination 'generic/platform=iOS' \
          -archivePath build/NeteaseMusic.xcarchive \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
          SKIP_INSTALL=NO \
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES
        
    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath build/NeteaseMusic.xcarchive \
          -exportPath build/IPA \
          -exportOptionsPlist NeteaseMusic/ExportOptions-GHA.plist \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: NeteaseMusic-IPA
        path: build/IPA/NeteaseMusic.ipa
        retention-days: 30
        
    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: NeteaseMusic-xcarchive
        path: build/NeteaseMusic.xcarchive
        retention-days: 30
