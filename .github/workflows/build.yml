name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Generate Xcode Project
      run: |
        cd NeteaseMusic
        xcodegen generate
    
    - name: Build Archive
      run: |
        cd NeteaseMusic
        xcodebuild -project NeteaseMusic.xcodeproj \
          -scheme NeteaseMusic \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $PWD/build/NeteaseMusic.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Package IPA
      run: |
        cd NeteaseMusic/build
        mkdir -p Payload
        cp -r NeteaseMusic.xcarchive/Products/Applications/NeteaseMusic.app Payload/
        zip -r Youmi-Music.ipa Payload
        rm -rf Payload
    
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Youmi-Music-IPA
        path: NeteaseMusic/build/Youmi-Music.ipa
        retention-days: 30
