name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16'
    
    - name: Show Xcode info
      run: |
        xcodebuild -version
        xcodebuild -showsdks
    
    - name: Check directory structure
      run: |
        ls -la
        ls -la NeteaseMusic
        ls -la NeteaseMusic/NeteaseMusic.xcodeproj
    
    - name: List project targets
      run: |
        cd NeteaseMusic
        xcodebuild -list -project NeteaseMusic.xcodeproj
    
    - name: Build Archive
      run: |
        cd NeteaseMusic
        xcodebuild -project NeteaseMusic.xcodeproj \
          -scheme NeteaseMusic \
          -configuration Release \
          -sdk iphoneos \
          -archivePath ./build/NeteaseMusic.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""
      continue-on-error: true
    
    - name: Check build output
      run: |
        cd NeteaseMusic
        if [ -d build ]; then
          ls -la build
          if [ -d build/NeteaseMusic.xcarchive ]; then
            ls -la build/NeteaseMusic.xcarchive/Products/Applications/
          fi
        fi
    
    - name: Package IPA if archive exists
      run: |
        cd NeteaseMusic
        if [ -d build/NeteaseMusic.xcarchive/Products/Applications/ ]; then
          mkdir -p build/Payload
          cp -r build/NeteaseMusic.xcarchive/Products/Applications/NeteaseMusic.app build/Payload/
          cd build
          zip -r Youmi-Music.ipa Payload
          rm -rf Payload
          ls -la *.ipa
        else
          echo "Archive not found, skipping IPA packaging"
        fi
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Youmi-Music-IPA
        path: NeteaseMusic/build/Youmi-Music.ipa
        retention-days: 30
      if: always()