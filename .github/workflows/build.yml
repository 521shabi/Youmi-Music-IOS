name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16'
    
    - name: Show Xcode and SDK info
      run: |
        xcodebuild -version
        xcodebuild -showsdks
    
    - name: List project structure
      run: |
        cd NeteaseMusic
        ls -la
        ls -la NeteaseMusic.xcodeproj
        cat NeteaseMusic.xcodeproj/project.pbxproj | grep -E "(PRODUCT_NAME|TARGET_NAME|scheme)" | head -20
    
    - name: List available schemes
      run: |
        cd NeteaseMusic
        xcodebuild -list -project NeteaseMusic.xcodeproj
    
    - name: Build for simulator first
      run: |
        cd NeteaseMusic
        xcodebuild build \
          -project NeteaseMusic.xcodeproj \
          -scheme NeteaseMusic \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""
    
    - name: Build Archive
      run: |
        cd NeteaseMusic
        xcodebuild -project NeteaseMusic.xcodeproj \
          -scheme NeteaseMusic \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $PWD/build/NeteaseMusic.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""
    
    - name: Verify archive
      run: |
        cd NeteaseMusic
        ls -la build/NeteaseMusic.xcarchive/Products/Applications/
    
    - name: Package IPA
      run: |
        cd NeteaseMusic/build
        mkdir -p Payload
        cp -r NeteaseMusic.xcarchive/Products/Applications/NeteaseMusic.app Payload/
        zip -r Youmi-Music.ipa Payload
        rm -rf Payload
        ls -la *.ipa
    
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Youmi-Music-IPA
        path: NeteaseMusic/build/Youmi-Music.ipa
        retention-days: 30